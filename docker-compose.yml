services:
  demo:
    build: .
    command: ["node", "scripts/start-demo.js"]
    environment:
      PORT: "3000"
      USERS_FILE: /app/data/users.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./audit:/app/audit

  # Start with --profile app; this service requires a populated .env file.
  app:
    profiles: ["app"]
    build: .
    env_file: .env
    command: ["node", "server.js"]
    environment:
      USERS_FILE: /app/data/users.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./data:/app/data
      - ./audit:/app/audit
